[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gazeguard"
version = "0.1.0"
description = "Precompute content-filter sidecars for video so modest viewers can blur explicit scenes at playback. No re-encoding; plays audio + subtitles through."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "opencv-python-headless>=4.8.0.0",
    "numpy>=1.26.0"
]

[project.scripts]
gazeguard = "gazeguard.main:app"

[tool.setuptools]
packages = ["gazeguard"]